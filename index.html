<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>latentblue</title>
    <meta name="description" content="latentblue">
    <meta name="robots" content="noindex">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        :root {
            --blue-deep: #0c1220;
            --blue-accent: #7db4e0;
            --white: #f0f4f8;
            --grey: #a0aec0;
            --grid-line: rgba(125, 180, 224, 0.04);
            --grid-major: rgba(125, 180, 224, 0.06);
        }

        html, body { height: 100%; }

        body {
            font-family: 'Manrope', -apple-system, BlinkMacSystemFont, sans-serif;
            background: var(--blue-deep);
            color: var(--white);
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
            overflow: hidden;
        }

        /* Blueprint grid */
        body::before {
            content: '';
            position: fixed;
            inset: 0;
            z-index: 0;
            pointer-events: none;
            background-image:
                linear-gradient(var(--grid-line) 1px, transparent 1px),
                linear-gradient(90deg, var(--grid-line) 1px, transparent 1px);
            background-size: 40px 40px;
            background-position: center center;
        }

        body::after {
            content: '';
            position: fixed;
            inset: 0;
            z-index: 0;
            pointer-events: none;
            background-image:
                linear-gradient(var(--grid-major) 1px, transparent 1px),
                linear-gradient(90deg, var(--grid-major) 1px, transparent 1px);
            background-size: 200px 200px;
            background-position: center center;
        }

        .bg-gradient {
            position: fixed;
            inset: 0;
            z-index: -1;
            background: linear-gradient(180deg, #0c1220 0%, #0f1a2e 100%);
        }


        /* Plotter crosshair: spawns on a grid node off the top-left corner and sweeps the
           diagonal, so the intersection passes through the nodes of the 40px grid */
        .cross {
            position: fixed;
            top: 0;
            left: 0;
            z-index: 0;
            pointer-events: none;
            --x0: 0px;
            --y0: 0px;
            --travel: 1200px;
            animation: sweep 24s linear infinite;
        }

        .cross-h {
            position: absolute;
            top: 0;
            left: -200vw;
            width: 400vw;
            height: 1px;
            background: linear-gradient(90deg, transparent, rgba(125, 180, 224, 0.22) 35%, rgba(125, 180, 224, 0.22) 65%, transparent);
        }

        .cross-v {
            position: absolute;
            left: 0;
            top: -200vh;
            height: 400vh;
            width: 1px;
            background: linear-gradient(180deg, transparent, rgba(125, 180, 224, 0.22) 35%, rgba(125, 180, 224, 0.22) 65%, transparent);
        }

        .cross-node {
            position: absolute;
            top: -1px;
            left: -1px;
            width: 3px;
            height: 3px;
            border-radius: 50%;
            background: var(--blue-accent);
            opacity: 0.55;
            box-shadow: 0 0 6px rgba(125, 180, 224, 0.5);
        }

        @keyframes sweep {
            from { transform: translate(var(--x0), var(--y0)); }
            to   { transform: translate(calc(var(--x0) + var(--travel)), calc(var(--y0) + var(--travel))); }
        }

        main {
            position: relative;
            z-index: 1;
            min-height: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 0 1rem 6vh;   /* optical centre sits a little above geometric centre */
            text-align: center;
        }

        .logo {
            font-family: 'Manrope', sans-serif;
            font-size: clamp(2rem, 6vw, 3.4rem);
            font-weight: 600;
            letter-spacing: -0.035em;
            color: var(--white);
            opacity: 0;
            animation: rise 1.2s ease 0.2s forwards;
        }

        .logo span { color: var(--blue-accent); }

        .line {
            font-family: 'Manrope', sans-serif;
            font-size: 0.95rem;
            font-weight: 400;
            color: var(--grey);
            margin-top: 1.6rem;
            letter-spacing: 0.02em;
            opacity: 0;
            animation: rise 1.2s ease 0.9s forwards;
        }



        @keyframes rise {
            from { opacity: 0; transform: translateY(10px); }
            to   { opacity: 1; transform: translateY(0); }
        }

        footer {
            position: fixed;
            bottom: 1.6rem;
            left: 0;
            width: 100%;
            z-index: 1;
            text-align: center;
            font-family: 'Manrope', sans-serif;
            font-size: 0.78rem;
            color: var(--grey);
            opacity: 0;
            animation: rise 1.2s ease 1.6s forwards;
        }

        footer a {
            color: var(--blue-accent);
            text-decoration: none;
            border-bottom: 1px solid rgba(125, 180, 224, 0.25);
            transition: border-color 0.2s ease;
        }

        footer a:hover { border-color: var(--blue-accent); }

        @media (prefers-reduced-motion: reduce) {
            .cross { display: none; }
            .logo, .line, footer { animation: none; opacity: 1; }
        }
    </style>
</head>
<body>
    <div class="bg-gradient"></div>
    <div class="cross" aria-hidden="true">
        <div class="cross-h"></div>
        <div class="cross-v"></div>
        <div class="cross-node"></div>
    </div>

    <main>
        <div class="logo">latent<span>blue</span></div>
        <div class="line">unlocking latent potential through design</div>
    </main>

    <footer>
        <a href="mailto:nick@latentblue.ai">nick@latentblue.ai</a>
    </footer>
    <script>
        (function () {
            var cross = document.querySelector('.cross');
            var cell = 40;
            function place() {
                var w = window.innerWidth, h = window.innerHeight;
                /* the grid is centred, so its lines sit at centre - cell/2 + n*cell;
                   pick the node just off the top-left corner */
                var x0 = ((w / 2 + cell / 2) % cell) - cell;
                var y0 = ((h / 2 + cell / 2) % cell) - cell;
                var travel = Math.ceil((Math.max(w, h) + 2 * cell) / cell) * cell;
                cross.style.setProperty('--x0', x0 + 'px');
                cross.style.setProperty('--y0', y0 + 'px');
                cross.style.setProperty('--travel', travel + 'px');
            }
            place();
            window.addEventListener('resize', place);
        })();
    </script>
</body>
</html>
